<!doctype html>
<html>
<head>
  <meta charset="utf-8" />
  <title>Lead Form Sandbox</title>
  <style>
    body { font-family: system-ui, Arial, sans-serif; padding: 24px; }
    form { display: grid; gap: 12px; max-width: 420px; }
    .field-error { color: #b00020; font-size: 12px; margin-top: 4px; }
    .is-invalid { border-color: #b00020; outline-color: #b00020; }
    button[type="submit"] {
      background: #111; color: white; border: none; padding: 10px 14px;
      border-radius: 6px; cursor: pointer; display: inline-flex; align-items: center;
    }
  </style>
</head>
<body>
  <form data-form="sandbox" novalidate>
    <input name="businessName" placeholder="Business name" />
    <input name="fullName" placeholder="Full name" />
    <input name="email" type="email" placeholder="Email" />
    <input name="phone" placeholder="Phone (123-456-7890)" />
    <input name="zipCode" placeholder="ZIP" />
    <select name="salesDistributionTier">
      <option value="">Annual revenue…</option>
      <option value="Tier 1a">Under $120K</option>
      <option value="Tier 1b">$120K–$249K</option>
      <option value="Tier 2a">$250K–$499K</option>
      <option value="Tier 2b">$500K–$999K</option>
      <option value="Tier 3">Over $1M</option>
    </select>
    <label><input name="consent" type="checkbox" value="on" /> Accept privacy policy</label>
    <button type="submit">Apply Now</button>
  </form>

  <script type="module">
    import { createForm } from './lib/FormFactory.js';
    import {
      required, all,
      emailStrict, phoneUS, zipUS,
      lettersHyphenSpaces, fullNameLettersOnly, mustAccept, requiredSelect,
    } from './lib/form-core/validators/index.js';
    import { formatPhoneUS, formatZipUS, stripDashes } from './lib/form-core/formatters/index.js';
    import { attributionPlugin } from './lib/form-core/plugins/attribution.js';
    import { submitButtonPlugin } from './lib/form-core/plugins/submitButton.js';
    import { queryParamsPlugin } from './lib/form-core/plugins/queryParams.js';
    import { tierMapPlugin } from './lib/form-core/plugins/tierMap.js';
    import { redirectOnUrlPlugin } from './lib/form-core/plugins/redirectOnUrl.js';
    import { serverValidationPlugin } from './lib/form-core/plugins/serverValidation.js';
    import { dataLayerPlugin } from './lib/form-core/plugins/dataLayer.js';
    import { fbclidResyncPlugin } from './lib/form-core/plugins/fbclidResync.js';
    import { staticFieldsPlugin } from './lib/form-core/plugins/staticFields.js';

    const getInput = (formId, name) => () => {
      const el = document.querySelector(`[data-form="${formId}"] [name="${name}"]`);
      if (!el) return '';
      if (el.type === 'checkbox') return el.checked ? 'on' : '';
      return (el.value ?? '').toString();
    };

    const handle = createForm({
      id: 'sandbox',
      // In production this points at the whitelisted public submit endpoint, e.g.
      //   https://www.nationalfunding.com/api/forms/submit
      endpoint: 'https://webhook.site/ad36f33f-9e4d-42ad-964d-870718347039',
      debug: true,
      fields: {
        email:                 { get: getInput('sandbox', 'email'),                 validate: all(required(), emailStrict()) },
        businessName:          { get: getInput('sandbox', 'businessName'),          validate: all(required(), lettersHyphenSpaces('Please enter your business name.')) },
        fullName:              { get: getInput('sandbox', 'fullName'),              validate: all(required(), fullNameLettersOnly()) },
        phone:                 { get: getInput('sandbox', 'phone'),                 validate: all(required(), phoneUS()), format: formatPhoneUS },
        zipCode:               { get: getInput('sandbox', 'zipCode'),               validate: all(required(), zipUS()),   format: formatZipUS },
        salesDistributionTier: { get: getInput('sandbox', 'salesDistributionTier'), validate: all(requiredSelect()) },
        consent:               { get: getInput('sandbox', 'consent'),               validate: all(mustAccept()) },
      },
      plugins: [
        // Order matters in two phases:
        //   1) Pre-send (attribution → queryParams → tierMap) compose onSubmit
        //      via wrapping in declaration order.
        //   2) Post-response — submitButton, serverValidation, dataLayer, then
        //      redirect — are awaited in declaration order. dataLayer must come
        //      BEFORE redirect so the GA hit gets a tick to fire.
        attributionPlugin({
          clientId: {
            cookieName: 'nfid',
            persistDays: 365,
            sameSite: 'Lax',
            secure: location.protocol === 'https:',
          },
        }),
        queryParamsPlugin(),
        tierMapPlugin(),
        // Routing-critical statics. Per the Lead Gateway implementation
        // guide (v1.0): formType determines the validation schema AND the
        // workflow; journey is a secondary routing parameter the gateway
        // uses for conditional validation (annualRevenueRange is required
        // for NFCoreApply, for example). To switch this form to a
        // different journey (e.g., XPRSApply), change `journey` here.
        staticFieldsPlugin({
          source: 'NF',
          formType: 'libform-sandbox',  // assigned by partner team — case-sensitive
          journey: 'NFCoreApply',
          responseChannel: 'Internet',
        }),
        // Runs in the enrich phase, after onSubmit mapping. If the URL has
        // ?fbclid=..., polls the _fbp cookie for up to 3s and rewrites the
        // landingPage payload field with the resynced URL. No-op when the
        // URL has no fbclid (zero added latency on the common path).
        fbclidResyncPlugin(),
        submitButtonPlugin(),
        serverValidationPlugin(),
        dataLayerPlugin({
          form_type: 'large_stand_alone_apply_now',
          // Auto picks gtag eventCallback when window.gtag exists, otherwise
          // microtask drain. 300ms is the upper bound, real delay is typically
          // far less — and only paid on success.
          reliability: 'auto',
          reliabilityTimeoutMs: 300,
          params: {
            event_tier: { source: 'form',     name: 'salesDistributionTier' },
            tierDetail: { source: 'form',     name: 'salesDistributionTier', as: 'label' },
            zip_code:   { source: 'form',     name: 'zipCode', default: '' },
            event_card: { source: 'response', path: 'event_card', default: 'no card submitted' },
            state:      { source: 'response', path: 'state', default: '' },
          },
        }),
        redirectOnUrlPlugin(),
      ],
      // Shape the form values into the Lead Gateway field schema. Routing
      // statics (source, formType, journey, responseChannel) are handled by
      // staticFieldsPlugin below — keep this function focused on form-data
      // mapping only.
      onSubmit(values) {
        return {
          fullName: values.fullName,
          email: values.email,
          phone: stripDashes(values.phone), // API strips non-digits, but be explicit
          businessName: values.businessName,
          zipCode: values.zipCode,
          consent: values.consent === 'on' || values.consent === true,
          // salesDistributionTier and annualRevenueRange are filled in by tierMapPlugin
        };
      },
      onSuccess(res) { console.log('[sandbox] success', res); },
      onError(err)   { console.warn('[sandbox] error', err.status, err.body || err.message); },
    });

    handle.ready
      .then(() => console.log('[sandbox] form ready'))
      .catch((err) => console.error('[sandbox] mount failed', err));
  </script>
</body>
</html>
